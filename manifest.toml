#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "write_nostr"
name = "write_nostr"
description.en = "Distraction-free long-form Markdown writing and publishing app for Nostr (NIP-23)"
description.fr = "Application d'écriture et de publication Markdown longue-forme pour Nostr (NIP-23), sans distraction"

version = "0.3.0~ynh1"

maintainers = ["imattau"]

[upstream]
license = "MIT"
website = "https://github.com/imattau/write_nostr"
code = "https://github.com/imattau/write_nostr"

[integration]
yunohost = ">= 11.1.9"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true
ldap = "not_relevant"
sso = "not_relevant"
disk = "150M"
ram.build = "1G"
ram.runtime = "1M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"
    help.en = "Who should be allowed to access write_nostr? Nostr authentication (browser extension, nsec, or passkey) happens inside the app itself and is independent of this permission."
    help.fr = "Qui doit pouvoir accéder à write_nostr ? L'authentification Nostr (extension navigateur, nsec, ou passkey) se fait dans l'application elle-même, indépendamment de cette permission."

[resources]
    [resources.sources.main]
    url = "https://github.com/imattau/write_nostr/archive/178b2f1ea90463de53a9dcac82f94e5c56d5d6a7.tar.gz"
    sha256 = "b8fc3bb5fee02b9ddd17b3fe9d435f8603bda817e5009ba4ca91069c15f43fe6"
    autoupdate.strategy = "latest_github_commit"

    [resources.system_user]

    [resources.install_dir]

    [resources.apt]
    packages = "ca-certificates"

    # write_nostr is a fully static SvelteKit SPA (adapter-static): Node is
    # only needed to build it. Nothing Node-related runs at request time -
    # nginx serves the prebuilt ./build directory directly.
    [resources.nodejs]
    version = "22"

    [resources.permissions]
    main.url = "/"
