# write_nostr is a static SvelteKit SPA. Keep missing hashed assets as 404s
# while routing application navigations back to index.html.
location /_app/ {
    alias __INSTALL_DIR__/build/_app/;
    try_files $uri =404;
}

location / {
    alias __INSTALL_DIR__/build/;
    index index.html;
    try_files $uri $uri/ /index.html;
}
